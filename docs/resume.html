<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Resume</title>

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      margin: 0;
      font-family: monospace;
    }

    .navbar {
      background-color: #062006;
      padding: 0.5rem 1rem;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-left: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 5px;
    }

    .navbar a:hover {
      background-color: #caa81d;
      color: white;
    }

    .resume-container {
      background-color: rgb(222, 179, 52);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .resume-image {
      width: 100%;
      max-width: 800px;
      height: auto;
      margin-bottom: 20px;
      border: 2px solid #444;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .download-btn {
      background-color: #223922;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 8px;
      font-family: monospace;
    }

    .download-btn:hover {
      background-color: #365e36;
      color: #edece3;
    }

    @media (max-width: 576px) {
      .navbar a {
        padding: 0.3rem 0.5rem;
        font-size: 14px;
        margin-left: 0.5rem;
      }

      .resume-container {
        padding: 20px 10px;
      }

      .download-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar d-flex justify-content-end">
    <a href="index.html">Home</a>
    <a href="myworks.html">My Works</a>
    <a href="resume.html">Resume</a>
  </nav>

  <!-- Resume Section -->
  <div class="resume-container container-fluid">
    <img src="assets/1.jpg" alt="Resume Page 1" class="resume-image img-fluid">
    <img src="assets/2.jpg" alt="Resume Page 2" class="resume-image img-fluid">
    <a href="assets/resume.pdf" download class="download-btn mt-3">Download Resume (PDF)</a>
  </div>

  <!-- Bootstrap JS (Optional if you use Bootstrap components like modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
